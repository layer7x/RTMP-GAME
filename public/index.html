<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RTMP – movement test</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>
:root{--bg:#151a24;--fg:#e8ecf4;--accent:#ffb24a;--btn:rgba(255,255,255,.14)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));font-size:13px;pointer-events:none}
.bar{width:140px;height:10px;border:1px solid var(--fg);border-radius:6px;overflow:hidden;margin-top:4px}
#gas{height:100%;width:100%;background:var(--accent)}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;opacity:.8;pointer-events:none}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,12,18,.82);text-align:center;padding:24px;cursor:pointer;z-index:20}
#start h1{margin:0 0 8px}
#start p{max-width:420px;line-height:1.5;opacity:.85}
#touch{display:none}
.touch #touch{display:block}
#lz,#jz{position:fixed;top:0;bottom:0}
#jz{left:16%;width:34%}
#lz{right:0;width:50%}
#jbase{position:fixed;width:100px;height:100px;margin:-50px;border-radius:50%;border:2px solid rgba(255,255,255,.35);display:none;pointer-events:none}
#jknob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:rgba(255,255,255,.4)}
.b{position:fixed;border-radius:50%;background:var(--btn);border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;z-index:5}
.b.on{background:rgba(255,178,74,.55)}
#bg{width:84px;height:84px;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#bb{width:84px;height:84px;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#bj{width:62px;height:62px;right:calc(30px + env(safe-area-inset-right,0px));bottom:calc(118px + env(safe-area-inset-bottom,0px))}
#hp{height:100%;width:100%;background:#e5484d}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(229,72,77,.6));z-index:3}
#feed{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:13px;pointer-events:none;text-align:center;z-index:4}
#map{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));width:150px;height:150px;border:1px solid rgba(255,255,255,.3);z-index:4}
#map.big{right:auto;left:50%;top:50%;transform:translate(-50%,-50%);width:min(80vmin,520px);height:min(80vmin,520px);z-index:15}
#bs{width:70px;height:70px;right:calc(112px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px))}
#nm{font:inherit;font-size:18px;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:var(--fg);width:min(280px,80vw);text-align:center;margin:8px 0;user-select:text;-webkit-user-select:text;touch-action:auto}
#go{font:inherit;font-size:18px;font-weight:600;padding:12px 40px;border-radius:12px;border:0;background:var(--accent);color:#1a1205;cursor:pointer;margin-top:6px}
</style>
</head>
<body>
<div id="hud"><div>Gas</div><div class="bar"><div id="gas"></div></div><div style="margin-top:6px">HP</div><div class="bar"><div id="hp"></div></div><div id="spd" style="margin-top:6px"></div><div id="cnt"></div></div>
<div id="cross"></div>
<div id="touch">
  <div id="jz"></div><div id="lz"></div>
  <div id="jbase"><div id="jknob"></div></div>
  <div class="b" id="bg">GRAPPLE</div><div class="b" id="bb">BOOST</div><div class="b" id="bj">JUMP</div><div class="b" id="bs">SHOOT</div>
</div>
<div id="flash"></div><div id="feed"></div><canvas id="map" width="420" height="420"></canvas>
<div id="start"><h1>RTMP</h1><input id="nm" maxlength="14" placeholder="What do you want to be called?" autocomplete="off"><p id="help"></p><button id="go">Play</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const T = THREE;
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');
document.getElementById('help').textContent = isTouch
  ? 'Left thumb: move with the stick, and hold BOOST (bottom left) to fly where you look. Right thumb: drag to look, tap GRAPPLE to latch on and tap again to let go. SHOOT fires at the crosshair. Tap the map to enlarge it.'
  : 'WASD: move · Mouse: look · Hold left click: grapple · Shift: boost · Space: jump · Esc: release mouse · Right click or F: shoot · M: map';

// ---------- renderer / scene ----------
const renderer = new T.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.25 : 1.5));
document.body.appendChild(renderer.domElement);
const scene = new T.Scene();
scene.background = new T.Color(0x151a24);
scene.fog = new T.Fog(0x151a24, 30, 160);
const cam = new T.PerspectiveCamera(75, 1, 0.1, 320);
cam.rotation.order = 'YXZ';
scene.add(new T.HemisphereLight(0xcfd8ff, 0x303040, 0.9));
const sun = new T.DirectionalLight(0xffffff, 0.6);
sun.position.set(0.4, 1, 0.3);
scene.add(sun);
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------- level: blank walls and ramps ----------
let seed = 12345;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const N = 14, C = 16, S = N * C, WH = 14, TH = 2;
const solids = [], ramps = [], hitMeshes = [];
const wallMat = new T.MeshLambertMaterial({ color: 0x8a94a8, flatShading: true });
const rampMat = new T.MeshLambertMaterial({ color: 0xc9a46a, flatShading: true });
const floor = new T.Mesh(new T.PlaneGeometry(S + 60, S + 60), new T.MeshLambertMaterial({ color: 0x2a3140 }));
floor.rotation.x = -Math.PI / 2; floor.position.set(S / 2, 0, S / 2);
scene.add(floor);

function addWall(cx, cz, w, d) {
  const m = new T.Mesh(new T.BoxGeometry(w, WH, d), wallMat);
  m.position.set(cx, WH / 2, cz); m.userData.top = WH;
  scene.add(m); hitMeshes.push(m);
  solids.push({ x0: cx - w / 2, x1: cx + w / 2, z0: cz - d / 2, z1: cz + d / 2, top: WH });
}
function addRamp(cx, cz, w, d, h, ax, sg) {
  const g = new T.BoxGeometry(w, h, d);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const lowSide = ax === 'x' ? p.getX(i) * sg < 0 : p.getZ(i) * sg < 0;
    if (p.getY(i) > 0 && lowSide) p.setY(i, -h / 2);
  }
  g.computeVertexNormals();
  const m = new T.Mesh(g, rampMat);
  m.position.set(cx, h / 2, cz);
  scene.add(m); hitMeshes.push(m);
  ramps.push({ x0: cx - w / 2, x1: cx + w / 2, z0: cz - d / 2, z1: cz + d / 2, h, ax, sg });
}
// border
addWall(S / 2, 0, S + TH, TH); addWall(S / 2, S, S + TH, TH);
addWall(0, S / 2, TH, S + TH); addWall(S, S / 2, TH, S + TH);
// maze: depth-first carve, then open a few extra gaps so there are loops
const open = {};
const seen = Array.from({ length: N }, () => Array(N).fill(false));
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
const pk = (i, j, d) => d === 0 ? i + ',' + j + ',0' : d === 1 ? i + ',' + j + ',1' : d === 2 ? (i - 1) + ',' + j + ',0' : i + ',' + (j - 1) + ',1';
const stack = [[0, 0]]; seen[0][0] = true;
while (stack.length) {
  const [i, j] = stack[stack.length - 1];
  const nb = [];
  DIRS.forEach((d, k) => { const a = i + d[0], b = j + d[1]; if (a >= 0 && b >= 0 && a < N && b < N && !seen[a][b]) nb.push(k); });
  if (!nb.length) { stack.pop(); continue; }
  const k = nb[Math.floor(rnd() * nb.length)];
  open[pk(i, j, k)] = true;
  const a = i + DIRS[k][0], b = j + DIRS[k][1];
  seen[a][b] = true; stack.push([a, b]);
}
for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
  if (i < N - 1 && rnd() < 0.18) open[i + ',' + j + ',0'] = true;
  if (j < N - 1 && rnd() < 0.18) open[i + ',' + j + ',1'] = true;
}
for (let i = 0; i < N - 1; i++) for (let j = 0; j < N; j++) if (!open[i + ',' + j + ',0']) addWall((i + 1) * C, (j + 0.5) * C, TH, C + TH);
for (let i = 0; i < N; i++) for (let j = 0; j < N - 1; j++) if (!open[i + ',' + j + ',1']) addWall((i + 0.5) * C, (j + 1) * C, C + TH, TH);
// ramps on a fixed pattern so every area has some
for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
  if ((i + 2 * j) % 5 === 3) addRamp((i + 0.5) * C, (j + 0.5) * C, 9, 9, 5, (i + j) % 2 ? 'x' : 'z', i % 2 ? 1 : -1);
}
function gh(x, z) {
  let g = 0;
  for (const s of solids) if (x > s.x0 && x < s.x1 && z > s.z0 && z < s.z1 && s.top > g) g = s.top;
  for (const r of ramps) if (x > r.x0 && x < r.x1 && z > r.z0 && z < r.z1) {
    let u = r.ax === 'x' ? (x - r.x0) / (r.x1 - r.x0) : (z - r.z0) / (r.z1 - r.z0);
    if (r.sg < 0) u = 1 - u;
    if (r.h * u > g) g = r.h * u;
  }
  return g;
}
const OFFS = [[0, 0], [.35, 0], [-.35, 0], [0, .35], [0, -.35]];
const blocked = (x, y, z) => OFFS.some(o => gh(x + o[0], z + o[1]) > y + 0.5);

// ---------- player ----------
const P = { x: C / 2, y: 0, z: C / 2, vx: 0, vy: 0, vz: 0, yaw: 0, pitch: 0, gas: 100, ground: true };
const inp = { mx: 0, mz: 0, jump: false, grap: false, boost: false };
let anchor = null, grapPrev = false;
const ray = new T.Raycaster(); ray.far = 90;
const ropeGeo = new T.BufferGeometry().setFromPoints([new T.Vector3(), new T.Vector3()]);
const rope = new T.Line(ropeGeo, new T.LineBasicMaterial({ color: 0xffffff }));
rope.frustumCulled = false; rope.visible = false; scene.add(rope);
const fwd = new T.Vector3(), tmp = new T.Vector3();

function step(dt) {
  const sy = Math.sin(P.yaw), cy = Math.cos(P.yaw);
  const wx = -sy * inp.mz + cy * inp.mx, wz = -cy * inp.mz - sy * inp.mx;
  const k = 1 - Math.exp(-(P.ground ? 12 : 1.5) * dt);
  P.vx += (wx * 9 - P.vx) * k * (P.ground || inp.mx || inp.mz ? 1 : 0.0) + (P.ground ? 0 : 0);
  P.vz += (wz * 9 - P.vz) * k * (P.ground || inp.mx || inp.mz ? 1 : 0.0);
  P.vy -= 22 * dt;
  if (inp.jump && P.ground) { P.vy = 8; P.ground = false; }
  inp.jump = false;

  cam.position.set(P.x, P.y + 1.7, P.z);
  cam.rotation.set(P.pitch, P.yaw, 0);
  cam.updateMatrixWorld();
  cam.getWorldDirection(fwd);

  let spending = false;
  if (inp.grap && !grapPrev && P.gas > 0) {
    ray.setFromCamera({ x: 0, y: 0 }, cam);
    const hit = ray.intersectObjects(hitMeshes)[0];
    if (hit) {
      anchor = hit.point.clone();
      const tp = hit.object.userData.top;
      if (tp && Math.abs(hit.face.normal.y) < 0.5) anchor.y = tp + 1.5;
    }
  }
  if (!inp.grap || P.gas <= 0) anchor = null;
  if (isTouch && inp.grap && !anchor) inp.grap = false; // tap-to-latch: missed or out of gas
  grapPrev = inp.grap;
  if (anchor) {
    tmp.copy(anchor).sub(cam.position);
    const dist = tmp.length();
    if (dist > 2) { tmp.normalize(); P.vx += tmp.x * 38 * dt; P.vy += tmp.y * 38 * dt; P.vz += tmp.z * 38 * dt; P.gas -= 12 * dt; spending = true; }
  }
  if (inp.boost && P.gas > 0) {
    P.vx += fwd.x * 34 * dt; P.vy += (fwd.y * 34 + 8) * dt; P.vz += fwd.z * 34 * dt;
    P.gas -= 22 * dt; spending = true;
  }
  if (!spending && P.ground) P.gas = Math.min(100, P.gas + 25 * dt);
  P.gas = Math.max(0, P.gas);

  const air = Math.exp(-0.12 * dt);
  P.vx *= air; P.vz *= air;
  const sp = Math.hypot(P.vx, P.vy, P.vz);
  if (sp > 38) { const f = 38 / sp; P.vx *= f; P.vy *= f; P.vz *= f; }

  const climb = anchor || inp.boost || !P.ground;
  const nx = P.x + P.vx * dt;
  if (!blocked(nx, P.y, P.z)) P.x = nx;
  else {
    const rise = gh(nx + Math.sign(P.vx) * 0.4, P.z) - P.y;
    if (climb && rise > 0.5 && rise < 3.2) P.vy = Math.max(P.vy, 11); else P.vx = 0;
  }
  const nz = P.z + P.vz * dt;
  if (!blocked(P.x, P.y, nz)) P.z = nz;
  else {
    const rise = gh(P.x, nz + Math.sign(P.vz) * 0.4) - P.y;
    if (climb && rise > 0.5 && rise < 3.2) P.vy = Math.max(P.vy, 11); else P.vz = 0;
  }
  P.x = Math.min(S - 1, Math.max(1, P.x));
  P.z = Math.min(S - 1, Math.max(1, P.z));

  const wasGround = P.ground;
  P.y += P.vy * dt;
  const g = gh(P.x, P.z);
  if (P.y <= g) { P.y = g; if (P.vy < 0) P.vy = 0; P.ground = true; }
  else if (wasGround && P.vy <= 0 && P.y - g < 0.35) { P.y = g; P.ground = true; }
  else P.ground = false;
}

function frame(now) {
  const dt = Math.min(0.05, (now - (frame.t || now)) / 1000);
  frame.t = now;
  if (started) step(dt);
  updateOthers(dt);
  updateFx(dt);
  cam.position.set(P.x, P.y + 1.7, P.z);
  cam.rotation.set(P.pitch, P.yaw, 0);
  if (anchor) {
    cam.updateMatrixWorld();
    tmp.set(0.3, -0.3, -0.4).applyMatrix4(cam.matrixWorld);
    const a = ropeGeo.attributes.position;
    a.setXYZ(0, tmp.x, tmp.y, tmp.z); a.setXYZ(1, anchor.x, anchor.y, anchor.z);
    a.needsUpdate = true; rope.visible = true;
  } else rope.visible = false;
  document.getElementById('gas').style.width = P.gas + '%';
  document.getElementById('spd').textContent = Math.round(Math.hypot(P.vx, P.vz)) + ' m/s';
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- multiplayer ----------
function spawn() {
  P.x = (Math.floor(Math.random() * N) + 0.5) * C + 6;
  P.z = (Math.floor(Math.random() * N) + 0.5) * C + 6;
  P.y = gh(P.x, P.z); P.yaw = Math.random() * 6.28; P.pitch = 0;
  P.vx = P.vy = P.vz = 0; P.gas = 100; anchor = null;
}
spawn();
const others = {};
function makeBody(id) {
  let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) % 360;
  const m = new T.MeshLambertMaterial({ color: new T.Color().setHSL(h / 360, 0.7, 0.55), flatShading: true });
  const g = new T.Group();
  const body = new T.Mesh(new T.CylinderGeometry(0.4, 0.4, 1.7, 8), m); body.position.y = 0.85;
  const nose = new T.Mesh(new T.BoxGeometry(0.3, 0.2, 0.3), new T.MeshBasicMaterial({ color: 0xffffff })); nose.position.set(0, 1.5, -0.4);
  g.add(body, nose); scene.add(g);
  body.userData.pid = id;
  return { mesh: g, body, tx: 0, ty: 0, tz: 0, tyaw: 0 };
}
function updateOthers(dt) {
  const k = 1 - Math.exp(-14 * dt);
  for (const id in others) {
    const o = others[id], m = o.mesh;
    m.position.x += (o.tx - m.position.x) * k;
    m.position.y += (o.ty - m.position.y) * k;
    m.position.z += (o.tz - m.position.z) * k;
    let d = o.tyaw - m.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d));
    m.rotation.y += d * k;
  }
}
const socket = typeof io === 'function' ? io() : null;
let myId = null;
if (socket) {
  socket.on('init', d => (myId = d.id));
  socket.on('died', () => spawn());
  socket.on('kill', d => say(nm(d.killer) + ' eliminated ' + nm(d.victim)));
  socket.on('players', list => {
    const seenIds = {};
    for (const p of list) {
      if (p.id === myId) { setHp(p.hp); continue; }
      seenIds[p.id] = 1;
      let o = others[p.id];
      if (!o) { o = others[p.id] = makeBody(p.id); o.mesh.position.set(p.x, p.y, p.z); }
      o.tx = p.x; o.ty = p.y; o.tz = p.z; o.tyaw = p.yaw;
      if (p.name && p.name !== o.name) { o.name = p.name; setTag(o, p.name); }
    }
    for (const id in others) if (!seenIds[id]) { scene.remove(others[id].mesh); delete others[id]; }
    document.getElementById('cnt').textContent = list.length + ' online';
  });
  setInterval(() => { if (started) socket.volatile.emit('state', { x: P.x, y: P.y, z: P.z, yaw: P.yaw }); }, 50);
}

// ---------- combat, hp, map ----------
let hp = 100, lastShot = 0, tracerT = 0;
const tracer = new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(), new T.Vector3()]), new T.LineBasicMaterial({ color: 0xffe08a }));
tracer.frustumCulled = false; tracer.visible = false; scene.add(tracer);
const gbEl = document.getElementById('bg');
let myName = 'Player';
try { const sn = localStorage.getItem('rtmpName'); if (sn) document.getElementById('nm').value = sn; } catch (e) {}
function setTag(o, name) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const g = c.getContext('2d'); g.font = 'bold 34px system-ui,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = 6; g.strokeStyle = 'rgba(0,0,0,.7)'; g.strokeText(name, 128, 32); g.fillStyle = '#fff'; g.fillText(name, 128, 32);
  if (o.tag) { o.tag.material.map.dispose(); o.tag.material.dispose(); o.mesh.remove(o.tag); }
  const sp = new T.Sprite(new T.SpriteMaterial({ map: new T.CanvasTexture(c), transparent: true }));
  sp.scale.set(2.4, 0.6, 1); sp.position.y = 2.3; o.mesh.add(sp); o.tag = sp;
}
const hpEl = document.getElementById('hp'), flashEl = document.getElementById('flash'), feedEl = document.getElementById('feed');
function setHp(v) {
  if (typeof v !== 'number') return;
  if (v < hp) { flashEl.style.opacity = 1; setTimeout(() => (flashEl.style.opacity = 0), 150); }
  hp = v; hpEl.style.width = Math.max(0, hp) + '%';
}
function say(t) { feedEl.textContent = t; clearTimeout(say.t); say.t = setTimeout(() => (feedEl.textContent = ''), 3500); }
const nm = n => String(n || '?').slice(0, 14);
function shoot() {
  const now = performance.now();
  if (now - lastShot < 220) return;
  lastShot = now;
  cam.updateMatrixWorld();
  ray.setFromCamera({ x: 0, y: 0 }, cam);
  const bodies = Object.values(others).map(o => o.body);
  const hit = ray.intersectObjects(hitMeshes.concat(bodies))[0];
  const end = hit ? hit.point : ray.ray.at(80, new T.Vector3());
  const start = new T.Vector3(0.25, -0.25, -0.6).applyMatrix4(cam.matrixWorld);
  const a = tracer.geometry.attributes.position;
  a.setXYZ(0, start.x, start.y, start.z); a.setXYZ(1, end.x, end.y, end.z); a.needsUpdate = true;
  tracer.visible = true; tracerT = 0.06;
  if (hit && hit.object.userData.pid && socket) socket.emit('hit', { id: hit.object.userData.pid });
}
function updateFx(dt) {
  if (tracerT > 0) { tracerT -= dt; if (tracerT <= 0) tracer.visible = false; }
  if (started && (inp.shoot || keys.KeyF)) shoot();
  if (isTouch) gbEl.classList.toggle('on', !!anchor);
  updateMap();
}
// map: follows you. Walls and ramps only; the orange dot is you and nobody else shows
const mapEl = document.getElementById('map'), mctx = mapEl.getContext('2d');
const mapImg = document.createElement('canvas'); mapImg.width = mapImg.height = S * 4;
(function () {
  const g = mapImg.getContext('2d'), u = 4;
  g.fillStyle = '#10141c'; g.fillRect(0, 0, S * u, S * u);
  g.fillStyle = '#c9a46a';
  for (const r of ramps) g.fillRect(r.x0 * u, r.z0 * u, (r.x1 - r.x0) * u, (r.z1 - r.z0) * u);
  g.strokeStyle = '#cfd6e6'; g.lineWidth = 6; g.beginPath(); g.rect(0, 0, S * u, S * u);
  for (let i = 0; i < N - 1; i++) for (let j = 0; j < N; j++) if (!open[i + ',' + j + ',0']) { g.moveTo((i + 1) * C * u, j * C * u); g.lineTo((i + 1) * C * u, (j + 1) * C * u); }
  for (let i = 0; i < N; i++) for (let j = 0; j < N - 1; j++) if (!open[i + ',' + j + ',1']) { g.moveTo(i * C * u, (j + 1) * C * u); g.lineTo((i + 1) * C * u, (j + 1) * C * u); }
  g.stroke();
})();
function updateMap() {
  const span = mapEl.classList.contains('big') ? 170 : 85, w = mapEl.width, sc = w / span, c = w / 2;
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.fillStyle = '#0a0d13'; mctx.fillRect(0, 0, w, w);
  mctx.setTransform(sc, 0, 0, sc, c - P.x * sc, c - P.z * sc);
  mctx.drawImage(mapImg, 0, 0, S, S);
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  const dx = -Math.sin(P.yaw), dy = -Math.cos(P.yaw);
  mctx.fillStyle = '#ffb24a';
  mctx.beginPath(); mctx.arc(c, c, 7, 0, 6.3); mctx.fill();
  mctx.beginPath();
  mctx.moveTo(c + dx * 22, c + dy * 22);
  mctx.lineTo(c - dy * 8 - dx * 2, c + dx * 8 - dy * 2);
  mctx.lineTo(c + dy * 8 - dx * 2, c - dx * 8 - dy * 2);
  mctx.closePath(); mctx.fill();
}
mapEl.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); mapEl.classList.toggle('big'); }, { passive: false });
addEventListener('keydown', e => { if (e.target.tagName !== 'INPUT' && e.code === 'KeyM') mapEl.classList.toggle('big'); });

// ---------- start / input ----------
let started = false;
const startEl = document.getElementById('start');
document.getElementById('go').addEventListener('click', () => {
  myName = (document.getElementById('nm').value.trim() || 'Player').slice(0, 14);
  try { localStorage.setItem('rtmpName', myName); } catch (e) {}
  if (socket) socket.emit('name', myName);
  started = true; startEl.style.display = 'none';
  if (isTouch) {
    try { document.documentElement.requestFullscreen().then(() => screen.orientation.lock('landscape').catch(() => {})).catch(() => {}); } catch (e) {}
  } else renderer.domElement.requestPointerLock();
});
document.addEventListener('pointerlockchange', () => {
  if (!isTouch && document.pointerLockElement !== renderer.domElement) { started = false; startEl.style.display = 'flex'; }
});
const clampPitch = () => (P.pitch = Math.max(-1.5, Math.min(1.5, P.pitch)));
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement !== renderer.domElement) return;
  P.yaw -= e.movementX * 0.0022; P.pitch -= e.movementY * 0.0022; clampPitch();
});
document.addEventListener('mousedown', e => { if (!document.pointerLockElement) return; if (e.button === 0) inp.grap = true; if (e.button === 2) inp.shoot = true; });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('mouseup', e => { if (e.button === 0) inp.grap = false; if (e.button === 2) inp.shoot = false; });
const keys = {};
function syncKeys() {
  inp.mz = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  inp.mx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  inp.boost = !!(keys.ShiftLeft || keys.ShiftRight);
}
addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; keys[e.code] = true; if (e.code === 'Space') { inp.jump = true; e.preventDefault(); } syncKeys(); });
addEventListener('keyup', e => { keys[e.code] = false; syncKeys(); });

// touch: floating joystick (left), look drag (right), hold buttons
if (isTouch) {
  const jz = document.getElementById('jz'), lz = document.getElementById('lz');
  const jb = document.getElementById('jbase'), jk = document.getElementById('jknob');
  let jid = null, ox = 0, oy = 0, lid = null, lx = 0, ly = 0;
  const find = (e, id) => [...e.changedTouches].find(t => t.identifier === id);
  jz.addEventListener('touchstart', e => {
    e.preventDefault(); const t = e.changedTouches[0]; jid = t.identifier; ox = t.clientX; oy = t.clientY;
    jb.style.display = 'block'; jb.style.left = ox + 'px'; jb.style.top = oy + 'px';
  }, { passive: false });
  jz.addEventListener('touchmove', e => {
    e.preventDefault(); const t = find(e, jid); if (!t) return;
    let dx = t.clientX - ox, dy = t.clientY - oy; const l = Math.hypot(dx, dy);
    if (l > 50) { dx *= 50 / l; dy *= 50 / l; }
    jk.style.transform = `translate(${dx}px,${dy}px)`;
    inp.mx = dx / 50; inp.mz = -dy / 50;
  }, { passive: false });
  const jend = e => { if (find(e, jid)) { jid = null; inp.mx = inp.mz = 0; jb.style.display = 'none'; jk.style.transform = ''; } };
  jz.addEventListener('touchend', jend); jz.addEventListener('touchcancel', jend);
  lz.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; lid = t.identifier; lx = t.clientX; ly = t.clientY; }, { passive: false });
  lz.addEventListener('touchmove', e => {
    e.preventDefault(); const t = find(e, lid); if (!t) return;
    P.yaw -= (t.clientX - lx) * 0.005; P.pitch -= (t.clientY - ly) * 0.005; clampPitch();
    lx = t.clientX; ly = t.clientY;
  }, { passive: false });
  const lend = e => { if (find(e, lid)) lid = null; };
  lz.addEventListener('touchend', lend); lz.addEventListener('touchcancel', lend);
  const hold = (id, on) => {
    const el = document.getElementById(id);
    const set = v => e => { e.preventDefault(); e.stopPropagation(); on(v); el.classList.toggle('on', v); };
    el.addEventListener('touchstart', set(true), { passive: false });
    el.addEventListener('touchend', set(false)); el.addEventListener('touchcancel', set(false));
  };
  document.getElementById('bg').addEventListener('touchstart', e => {
    e.preventDefault(); e.stopPropagation(); inp.grap = !anchor; // tap latches, tap again lets go
  }, { passive: false });
  hold('bb', v => (inp.boost = v));
  hold('bj', v => { if (v) inp.jump = true; });
  hold('bs', v => (inp.shoot = v));
}
</script>
