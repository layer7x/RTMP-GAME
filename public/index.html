<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RustTide</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>
:root{--bg:#151a24;--fg:#e8ecf4;--accent:#ffb24a;--btn:rgba(255,255,255,.14)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));font-size:13px;pointer-events:none}
.bar{width:140px;height:10px;border:1px solid var(--fg);border-radius:6px;overflow:hidden;margin-top:4px}
#gas{height:100%;width:100%;background:var(--accent)}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;opacity:.8;pointer-events:none}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,12,18,.82);text-align:center;padding:24px;cursor:pointer;z-index:20}
#start h1{margin:0 0 8px}
#start p{max-width:420px;line-height:1.5;opacity:.85}
#touch{display:none}
.touch #touch{display:block}
#lz,#jz{position:fixed;top:0;bottom:0}
#jz{left:0;width:42%;top:30%}
#lz{right:0;width:58%}
#jbase{position:fixed;width:120px;height:120px;margin:-60px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);left:calc(100px + env(safe-area-inset-left,0px));top:calc(100% - 100px - env(safe-area-inset-bottom,0px));opacity:.55;pointer-events:none}
#jbase.act{opacity:1}
#jknob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:rgba(255,255,255,.4)}
.b{position:fixed;border-radius:50%;background:var(--btn);border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;z-index:5}
.b.on{background:rgba(255,178,74,.55)}
#bg{width:72px;height:72px;right:calc(150px + env(safe-area-inset-right,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px))}
#bb{width:76px;height:76px;left:calc(18px + env(safe-area-inset-left,0px));top:calc(130px + env(safe-area-inset-top,0px))}
#bj{width:64px;height:64px;right:calc(160px + env(safe-area-inset-right,0px));bottom:calc(118px + env(safe-area-inset-bottom,0px))}
#hp{height:100%;width:100%;background:#e5484d}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(229,72,77,.6));z-index:3}
#feed{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:13px;pointer-events:none;text-align:center;z-index:4}
#map{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));width:150px;height:150px;border:1px solid rgba(255,255,255,.3);z-index:4}
#map.big{right:auto;left:50%;top:50%;transform:translate(-50%,-50%);width:min(80vmin,520px);height:min(80vmin,520px);z-index:15}
#bs{width:96px;height:96px;right:calc(28px + env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));font-size:14px}
#nm{font:inherit;font-size:18px;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:var(--fg);width:min(280px,80vw);text-align:center;margin:8px 0;user-select:text;-webkit-user-select:text;touch-action:auto}
#go{font:inherit;font-size:18px;font-weight:600;padding:12px 40px;border-radius:12px;border:0;background:var(--accent);color:#1a1205;cursor:pointer;margin-top:6px}
.touch #map:not(.big){width:120px;height:120px}
#bsl{width:64px;height:64px;left:calc(108px + env(safe-area-inset-left,0px));top:calc(130px + env(safe-area-inset-top,0px))}
#start.paused #nm{display:none}
#settings{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,12,18,.9);z-index:25;touch-action:auto}
#settings.on{display:flex}
.card{display:flex;flex-direction:column;gap:10px;width:min(360px,90vw);max-height:90vh;overflow:auto;padding:16px;border-radius:14px;background:#1d2330;touch-action:auto}
.card h2{margin:0}
.card label{display:flex;flex-direction:column;font-size:13px;gap:4px}
.card input{width:100%;box-sizing:border-box;touch-action:auto;user-select:text;-webkit-user-select:text}
button.sec{font:inherit;padding:10px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--fg);cursor:pointer}
.tonly{display:none}
.touch .tonly{display:inline-block}
#gear{display:none;position:fixed;right:calc(10px + env(safe-area-inset-right,0px));top:calc(140px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:50%;background:var(--btn);align-items:center;justify-content:center;z-index:6;font-size:20px}
.touch #gear{display:flex}
#edit{position:fixed;inset:0;display:none;z-index:30;background:rgba(0,0,0,.35);touch-action:none}
#edit.on{display:block}
#hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:13px;text-align:center;pointer-events:none}
#ebar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:#1d2330;padding:10px 14px;border-radius:12px}
.sel{outline:3px dashed var(--accent)}
</style>
</head>
<body>
<div id="hud"><div>Gas</div><div class="bar"><div id="gas"></div></div><div style="margin-top:6px">HP</div><div class="bar"><div id="hp"></div></div><div id="spd" style="margin-top:6px"></div><div id="cnt"></div></div>
<div id="cross"></div>
<div id="touch">
  <div id="jz"></div><div id="lz"></div>
  <div id="jbase"><div id="jknob"></div></div>
  <div class="b" id="bg">GRAPPLE</div><div class="b" id="bb">BOOST</div><div class="b" id="bj">JUMP</div><div class="b" id="bs">SHOOT</div><div class="b" id="bsl">SLIDE</div>
</div>
<div id="gear">⚙</div>
<div id="settings"><div class="card"><h2>Settings</h2>
<label>Look sensitivity<input type="range" id="s_look" min="0.3" max="2.5" step="0.05"></label>
<label>Aim while shooting<input type="range" id="s_aim" min="0.3" max="2.5" step="0.05"></label>
<label>Mouse sensitivity<input type="range" id="s_mouse" min="0.3" max="2.5" step="0.05"></label>
<label>Volume<input type="range" id="s_vol" min="0" max="1" step="0.05"></label>
<label>Name<input id="s_name" maxlength="14"></label>
<button class="sec tonly" id="s_edit">Edit button layout</button><button class="sec tonly" id="s_reset">Reset layout</button>
<button class="sec" id="s_close">Close</button></div></div>
<div id="edit"><div id="hint">Drag a button to move it. Tap one, then use the slider to resize it.</div><div id="ebar"><input type="range" id="e_size" min="0.6" max="1.8" step="0.05" value="1"><button class="sec" id="e_done">Done</button></div></div>
<div id="flash"></div><div id="feed"></div><canvas id="map" width="420" height="420"></canvas>
<div id="start"><h1>RustTide</h1><input id="nm" maxlength="14" placeholder="What do you want to be called?" autocomplete="off"><p id="help"></p><button id="go">Play</button> <button id="setb" class="sec">Settings</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/utils/SkeletonUtils.js"></script>
<script src="level.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const T = THREE;
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');
document.getElementById('help').textContent = isTouch
  ? 'Left thumb: stick to move (push it to the edge to sprint), SLIDE while sprinting, BOOST (top left) or hold JUMP in the air to fly where you look. Right thumb: drag to look, hold SHOOT and drag to aim while firing, tap GRAPPLE to latch on and tap again to let go. Tap the map to enlarge it.'
  : 'WASD: move · Shift: sprint · Ctrl or C: slide (while sprinting) · Space: jump, and hold Space in the air to boost · Mouse: look · Left click or F: shoot · Hold right click: grapple · M: map · Esc: release mouse';

// ---------- renderer / scene ----------
const renderer = new T.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.25 : 1.5));
document.body.appendChild(renderer.domElement);
const scene = new T.Scene();
scene.background = new T.Color(0x151a24);
scene.fog = new T.Fog(0x151a24, 30, 160);
const cam = new T.PerspectiveCamera(75, 1, 0.1, 320);
cam.rotation.order = 'YXZ';
scene.add(new T.HemisphereLight(0xcfd8ff, 0x303040, 0.9));
const sun = new T.DirectionalLight(0xffffff, 0.6);
sun.position.set(0.4, 1, 0.3);
scene.add(sun);
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------- level: shared with the server (level.js) ----------
const L = Level.build(), { N, C, S, WH, TH, open } = L, solids = L.solids, ramps = L.ramps, hitMeshes = [];
const wallMat = new T.MeshLambertMaterial({ color: 0x8a94a8, flatShading: true });
const rampMat = new T.MeshLambertMaterial({ color: 0xc9a46a, flatShading: true });
const floor = new T.Mesh(new T.PlaneGeometry(S + 60, S + 60), new T.MeshLambertMaterial({ color: 0x2a3140 }));
floor.rotation.x = -Math.PI / 2; floor.position.set(S / 2, 0, S / 2);
scene.add(floor);
for (const w of solids) {
  const m = new T.Mesh(new T.BoxGeometry(w.x1 - w.x0, WH, w.z1 - w.z0), wallMat);
  m.position.set((w.x0 + w.x1) / 2, WH / 2, (w.z0 + w.z1) / 2); m.userData.top = WH;
  scene.add(m); hitMeshes.push(m);
}
for (const r of ramps) {
  const g = new T.BoxGeometry(r.x1 - r.x0, r.h, r.z1 - r.z0), q = g.attributes.position;
  for (let i = 0; i < q.count; i++) {
    const low = r.ax === 'x' ? q.getX(i) * r.sg < 0 : q.getZ(i) * r.sg < 0;
    if (q.getY(i) > 0 && low) q.setY(i, -r.h / 2);
  }
  g.computeVertexNormals();
  const m = new T.Mesh(g, rampMat);
  m.position.set((r.x0 + r.x1) / 2, r.h / 2, (r.z0 + r.z1) / 2);
  scene.add(m); hitMeshes.push(m);
}
function gh(x, z) {
  let g = 0;
  for (const s of solids) if (x > s.x0 && x < s.x1 && z > s.z0 && z < s.z1 && s.top > g) g = s.top;
  for (const r of ramps) if (x > r.x0 && x < r.x1 && z > r.z0 && z < r.z1) {
    let u = r.ax === 'x' ? (x - r.x0) / (r.x1 - r.x0) : (z - r.z0) / (r.z1 - r.z0);
    if (r.sg < 0) u = 1 - u;
    if (r.h * u > g) g = r.h * u;
  }
  return g;
}
const OFFS = [[0, 0], [.35, 0], [-.35, 0], [0, .35], [0, -.35]];
const blocked = (x, y, z) => OFFS.some(o => gh(x + o[0], z + o[1]) > y + 0.5);

// ---------- player ----------
const MAXGAS = 130;
const P = { x: C / 2, y: 0, z: C / 2, vx: 0, vy: 0, vz: 0, yaw: 0, pitch: 0, gas: MAXGAS, ground: true, slide: false, slideT: 0, sprinting: false, boosting: false, eye: 1.7, rise: 0, air: 0 };
const inp = { mx: 0, mz: 0, jump: false, grap: false, boost: false };
let anchor = null, grapPrev = false, slideCd = 0, lastSprintT = 0, sprintBlock = false;
const ray = new T.Raycaster(); ray.far = 90;
const ropeGeo = new T.BufferGeometry().setFromPoints([new T.Vector3(), new T.Vector3()]);
const rope = new T.Line(ropeGeo, new T.LineBasicMaterial({ color: 0xffffff }));
rope.frustumCulled = false; rope.visible = false; scene.add(rope);
const fwd = new T.Vector3(), tmp = new T.Vector3();

function rampGrad(x, z) {
  for (const r of ramps) if (x > r.x0 && x < r.x1 && z > r.z0 && z < r.z1) {
    const len = r.ax === 'x' ? r.x1 - r.x0 : r.z1 - r.z0, gr = (r.h / len) * r.sg;
    return r.ax === 'x' ? [gr, 0] : [0, gr];
  }
  return [0, 0];
}
function startSlide() {
  const sp = Math.hypot(P.vx, P.vz) || 1, f = Math.max(sp, 15) / sp;
  P.vx *= f; P.vz *= f; P.slide = true; P.slideT = 0.9; slideSnd();
}
function endSlide() { P.slide = false; slideCd = 1.0; }

function step(dt) {
  const sy = Math.sin(P.yaw), cy = Math.cos(P.yaw);
  const wx = -sy * inp.mz + cy * inp.mx, wz = -cy * inp.mz - sy * inp.mx;
  const moving = Math.hypot(inp.mx, inp.mz) > 0.2;
  if (!inp.sprint) sprintBlock = false;
  P.sprinting = !!inp.sprint && !sprintBlock && P.ground && !P.slide && moving;
  if (P.sprinting) lastSprintT = performance.now();
  if (slideCd > 0) slideCd -= dt;
  if (inp.slide) {
    inp.slide = false;
    if (P.ground && !P.slide && slideCd <= 0 && Math.hypot(P.vx, P.vz) > 8.5) startSlide();
  }
  if (P.slide) {
    const rg = rampGrad(P.x, P.z);
    P.vx += -rg[0] * 26 * dt; P.vz += -rg[1] * 26 * dt;
    const fr = Math.exp(-1.1 * dt); P.vx *= fr; P.vz *= fr;
    const downhill = Math.hypot(rg[0], rg[1]) > 0.2 && (P.vx * rg[0] + P.vz * rg[1]) < 0;
    if (!downhill) P.slideT -= dt;
    if (P.slideT <= 0 || Math.hypot(P.vx, P.vz) < 4 || !P.ground) endSlide();
  } else {
    const k = 1 - Math.exp(-(P.ground ? 12 : 1.5) * dt), spd = P.sprinting ? 14 : 9;
    P.vx += (wx * spd - P.vx) * k * (P.ground || inp.mx || inp.mz ? 1 : 0.0);
    P.vz += (wz * spd - P.vz) * k * (P.ground || inp.mx || inp.mz ? 1 : 0.0);
  }
  P.vy -= 22 * dt;
  if (inp.jump && P.ground) { P.vy = 8; P.ground = false; }
  inp.jump = false;
  P.air = P.ground ? 0 : P.air + dt;
  P.boosting = P.gas > 0 && (inp.boost || (inp.jumpHeld && P.air > 0.18));

  cam.position.set(P.x, P.y + P.eye, P.z);
  cam.rotation.set(P.pitch, P.yaw, 0);
  cam.updateMatrixWorld();
  cam.getWorldDirection(fwd);

  let spending = false;
  if (inp.grap && !grapPrev && P.gas > 0) {
    ray.setFromCamera({ x: 0, y: 0 }, cam);
    const hit = ray.intersectObjects(hitMeshes)[0];
    if (hit) {
      anchor = hit.point.clone(); grappleSnd();
      const tp = hit.object.userData.top;
      if (tp && Math.abs(hit.face.normal.y) < 0.5) anchor.y = tp + 1.5;
    }
  }
  if (!inp.grap || P.gas <= 0) anchor = null;
  if (isTouch && inp.grap && !anchor) inp.grap = false; // tap-to-latch: missed or out of gas
  grapPrev = inp.grap;
  if (anchor) {
    tmp.copy(anchor).sub(cam.position);
    const dist = tmp.length();
    if (dist > 2) { tmp.normalize(); P.vx += tmp.x * 38 * dt; P.vy += tmp.y * 38 * dt; P.vz += tmp.z * 38 * dt; P.gas -= 9 * dt; spending = true; }
  }
  if (P.boosting) {
    P.vx += fwd.x * 34 * dt; P.vy += (fwd.y * 34 + 8) * dt; P.vz += fwd.z * 34 * dt;
    P.gas -= 18 * dt; spending = true;
  }
  if (!spending) P.gas = Math.min(MAXGAS, P.gas + (P.ground ? 55 : 8) * dt);
  P.gas = Math.max(0, P.gas);

  const air = Math.exp(-0.12 * dt);
  P.vx *= air; P.vz *= air;
  const sp = Math.hypot(P.vx, P.vy, P.vz);
  if (sp > 38) { const f = 38 / sp; P.vx *= f; P.vy *= f; P.vz *= f; }

  const climb = anchor || P.boosting || !P.ground;
  const nx = P.x + P.vx * dt;
  if (!blocked(nx, P.y, P.z)) P.x = nx;
  else {
    const rise = gh(nx + Math.sign(P.vx) * 0.4, P.z) - P.y;
    if (climb && rise > 0.5 && rise < 3.2) P.vy = Math.max(P.vy, 11); else P.vx = 0;
  }
  const nz = P.z + P.vz * dt;
  if (!blocked(P.x, P.y, nz)) P.z = nz;
  else {
    const rise = gh(P.x, nz + Math.sign(P.vz) * 0.4) - P.y;
    if (climb && rise > 0.5 && rise < 3.2) P.vy = Math.max(P.vy, 11); else P.vz = 0;
  }
  P.x = Math.min(S - 1, Math.max(1, P.x));
  P.z = Math.min(S - 1, Math.max(1, P.z));

  const wasGround = P.ground, y0 = P.y;
  P.y += P.vy * dt;
  const g = gh(P.x, P.z);
  if (P.y <= g) { P.y = g; if (P.vy < 0) P.vy = 0; P.ground = true; }
  else if (wasGround && P.vy <= 0 && P.y - g < 0.35) { P.y = g; P.ground = true; }
  else { P.ground = false; if (wasGround && P.vy <= 0 && P.rise > 1) P.vy = Math.min(P.rise, 12); }
  if (P.ground) P.rise = P.rise * 0.5 + ((P.y - y0) / dt) * 0.5; else if (!wasGround) P.rise = 0;
}

function frame(now) {
  const dt = Math.min(0.05, (now - (frame.t || now)) / 1000);
  frame.t = now;
  if (started) step(dt);
  updateOthers(dt);
  updateFx(dt);
  cam.position.set(P.x, P.y + P.eye, P.z);
  cam.rotation.set(P.pitch, P.yaw, 0);
  if (anchor) {
    cam.updateMatrixWorld();
    tmp.set(0.3, -0.3, -0.4).applyMatrix4(cam.matrixWorld);
    const a = ropeGeo.attributes.position;
    a.setXYZ(0, tmp.x, tmp.y, tmp.z); a.setXYZ(1, anchor.x, anchor.y, anchor.z);
    a.needsUpdate = true; rope.visible = true;
  } else rope.visible = false;
  document.getElementById('gas').style.width = (P.gas / MAXGAS * 100) + '%';
  document.getElementById('spd').textContent = Math.round(Math.hypot(P.vx, P.vz)) + ' m/s';
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- multiplayer ----------
function spawn() {
  P.x = (Math.floor(Math.random() * N) + 0.5) * C + 6;
  P.z = (Math.floor(Math.random() * N) + 0.5) * C + 6;
  P.y = gh(P.x, P.z); P.yaw = Math.random() * 6.28; P.pitch = 0;
  P.vx = P.vy = P.vz = 0; P.gas = MAXGAS; P.slide = false; slideCd = 0; anchor = null;
}
spawn();
const others = {};

// ---------- player model + animations ----------
const MODEL = {
  url: 'models/Percival.glb',   // put your file in public/models/
  height: 1.7,               // model is auto-scaled to this height (matches the hitbox)
  yaw: 0,                    // set to Math.PI if your model walks backwards
  fade: 0.18,                // seconds to blend between animations
  sprintSpeed: 11.5,         // m/s above which the sprint clip plays
  // exact clip names from your file; leave null to auto-detect from the name
  clips: { idle: null, run: null, sprint: null, slide: null, air: null }
};
const CLIP_RX = { idle: /idle|stand|breath/i, run: /run|jog|walk/i, sprint: /sprint|fast/i, slide: /slide|crouch/i, air: /jump|fall|air|fly/i };
const CLIP_FALLBACK = { idle: [], run: ['idle'], sprint: ['run', 'idle'], slide: ['run', 'idle'], air: ['run', 'idle'] };
let modelSrc = null; // { scene, clips, names } once loaded

if (T.GLTFLoader) new T.GLTFLoader().load(MODEL.url, gltf => {
  const sc = gltf.scene;
  sc.traverse(n => {
    if (n.isMesh) {
      n.frustumCulled = false; // skinned meshes can vanish with a stale bounding box
      for (const mt of [].concat(n.material)) if (mt.map) { mt.map.encoding = T.LinearEncoding; mt.needsUpdate = true; } // match the game's non-sRGB output
    }
  });
  const box = new T.Box3().setFromObject(sc), size = box.getSize(new T.Vector3());
  const k = size.y > 0 ? MODEL.height / size.y : 1;
  const holder = new T.Group(); // normalised: feet at y=0, correct height, yaw offset
  sc.position.set(-(box.min.x + box.max.x) / 2, -box.min.y, -(box.min.z + box.max.z) / 2);
  const inner = new T.Group(); inner.add(sc); inner.scale.setScalar(k); inner.rotation.y = MODEL.yaw; holder.add(inner);
  modelSrc = { root: holder, clips: gltf.animations };
  console.log('[model] loaded. animation clips:', gltf.animations.map(c => c.name));
  for (const id in others) attachModel(others[id]);
}, undefined, err => console.warn('[model] could not load ' + MODEL.url + ', using placeholder bodies', err));

function findClip(state) {
  const want = MODEL.clips[state];
  if (want) { const c = modelSrc.clips.find(c => c.name === want); if (c) return c; }
  const c = modelSrc.clips.find(c => CLIP_RX[state].test(c.name));
  if (c) return c;
  for (const f of CLIP_FALLBACK[state]) { const c2 = findClip(f); if (c2) return c2; }
  return null;
}

  }, { passive: false });
  const lend = e => { if (find(e, lid)) lid = null; };
  lz.addEventListener('touchend', lend); lz.addEventListener('touchcancel', lend);
  const hold = (id, on) => {
    const el = document.getElementById(id);
    const set = v => e => { e.preventDefault(); e.stopPropagation(); on(v); el.classList.toggle('on', v); };
    el.addEventListener('touchstart', set(true), { passive: false });
    el.addEventListener('touchend', set(false)); el.addEventListener('touchcancel', set(false));
  };
  document.getElementById('bg').addEventListener('touchstart', e => {
    e.preventDefault(); e.stopPropagation(); inp.grap = !anchor; // tap latches, tap again lets go
  }, { passive: false });
  hold('bb', v => (inp.boost = v));
  hold('bj', v => { if (v) inp.jump = true; inp.jumpHeld = v; });
  document.getElementById('bsl').addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); inp.slide = true; }, { passive: false });
  const bsEl = document.getElementById('bs'); let sid = null, sx = 0, sy = 0;
  bsEl.addEventListener('touchstart', e => {
    e.preventDefault(); e.stopPropagation();
    const t = e.changedTouches[0]; sid = t.identifier; sx = t.clientX; sy = t.clientY;
    inp.shoot = true; bsEl.classList.add('on');
  }, { passive: false });
  bsEl.addEventListener('touchmove', e => {
    e.preventDefault(); const t = find(e, sid); if (!t) return;
    P.yaw -= (t.clientX - sx) * 0.005 * cfg.aim; P.pitch -= (t.clientY - sy) * 0.005 * cfg.aim; clampPitch();
    sx = t.clientX; sy = t.clientY;
  }, { passive: false });
  const sEnd = e => { if (find(e, sid)) { sid = null; inp.shoot = false; bsEl.classList.remove('on'); } };
  bsEl.addEventListener('touchend', sEnd); bsEl.addEventListener('touchcancel', sEnd);
}
</script>
</body>
</html>
